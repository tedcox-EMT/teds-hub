<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bedford County, Tennessee</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --navy:#002d65; --red:#c8102e; --paper:#f4f6f8; --ink:#1b2430; --muted:#5a6a7c; --line:#d5deea; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; }
    .stripe { height: 6px; background: var(--red); }
    main { max-width: 560px; margin: 0 auto; padding: 56px 24px; }
    h1 { margin: 0 0 8px; color: var(--navy); font-size: 1.8rem; }
    p { color: var(--muted); }
    a.card {
      display: block;
      margin-top: 24px;
      padding: 18px 20px;
      background: #fff;
      border: 1px solid var(--navy);
      border-radius: 6px;
      text-decoration: none;
      color: var(--ink);
    }
    a.card strong { display: block; color: var(--navy); font-size: 1.15rem; }
    a.card span { display: block; margin-top: 4px; color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="stripe"></div>
  <main>
    <h1>Bedford County, Tennessee</h1>
    <p>Choose a page.</p>
    <a class="card" href="/emstoolkit/">
      <strong>Tennessee EMS Toolkit</strong>
      <span>State rules, forms, and Office contacts</span>
    </a>
  </main>
</body>
</html>
