<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bedford County, Tennessee</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --navy:#002d65; --red:#c8102e; --paper:#f4f6f8; --ink:#1b2430; --muted:#5a6a7c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; }
    .stripe { height: 6px; background: var(--red); }
    main { max-width: 560px; margin: 0 auto; padding: 56px 24px; }
    h1 { margin: 0; color: var(--navy); font-size: 1.8rem; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <div class="stripe"></div>
  <main>
    <h1>Bedford County, Tennessee</h1>
  </main>
</body>
</html>
