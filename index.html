<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bedford County</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5c6b7c;
      --line: #d7deE6;
      --paper: #f4f6f8;
      --navy: #16324f;
      --gold: #b8893a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Calibri, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(700px 280px at 50% -40px, #ffffff 0%, transparent 70%),
        var(--paper);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }
    main {
      width: min(560px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(22, 50, 79, 0.08);
    }
    .mark {
      background: var(--navy);
      padding: 36px 24px 28px;
      text-align: center;
    }
    .crest {
      width: 84px;
      height: 84px;
      margin: 0 auto 16px;
      display: block;
    }
    .mark p {
      margin: 0;
      color: #f3e6c8;
      font-family: Cambria, Georgia, serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }
    .body { padding: 32px 28px 28px; }
    h1 {
      margin: 0 0 10px;
      font-family: Cambria, Georgia, serif;
      font-size: clamp(1.8rem, 4vw, 2.3rem);
      color: var(--navy);
      line-height: 1.15;
    }
    p.lead {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 1.12rem;
      line-height: 1.45;
    }
    a.mail {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--navy);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 14px 18px;
      border-radius: 999px;
      border: 2px solid var(--gold);
    }
    a.mail:hover { background: #10263c; }
    a.mail:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    @media (max-width: 520px) {
      .body { padding: 26px 18px 22px; }
      a.mail { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">
      <svg class="crest" viewBox="0 0 84 84" aria-hidden="true">
        <circle cx="42" cy="42" r="40" fill="none" stroke="#b8893a" stroke-width="2"/>
        <circle cx="42" cy="42" r="30" fill="none" stroke="#f3e6c8" stroke-width="1"/>
        <path d="M42 18l6.2 14.2L63 34.4l-11.2 9.4L54.6 58 42 50.8 29.4 58l2.8-14.2L21 34.4l14.8-2.2z" fill="#f3e6c8"/>
      </svg>
      <p>Bedford County</p>
    </div>
    <div class="body">
      <h1>For information, write here</h1>
      <p class="lead">Send a note and it will come to this address.</p>
      <a class="mail" href="mailto:mail@bedfordtn.com">mail@bedfordtn.com</a>
    </div>
  </main>
</body>
</html>
