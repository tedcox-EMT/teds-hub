<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bedford County, Tennessee</title>
  <meta name="description" content="Bedford County, Tennessee.">
  <meta name="robots" content="noindex">
  <style>
    :root { --navy:#002d65; --red:#c8102e; --paper:#f4f6f8; --ink:#1b2430; --muted:#5a6a7c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .stripe { height: 6px; background: var(--red); }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
    }
    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      letter-spacing: -0.02em;
      text-align: center;
    }
    p {
      margin: 10px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="stripe"></div>
  <main>
    <div>
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="32" fill="#c8102e"/>
        <circle cx="32" cy="32" r="26" fill="#ffffff"/>
        <circle cx="32" cy="32" r="22" fill="#002d65"/>
        <g fill="#ffffff">
          <path transform="translate(32 24)" d="M0,-7 L1.6,-2.2 L6.7,-2.2 L2.6.8 L4.1,5.7 L0,2.7 L-4.1,5.7 L-2.6.8 L-6.7,-2.2 L-1.6,-2.2 Z"/>
          <path transform="translate(24 38)" d="M0,-7 L1.6,-2.2 L6.7,-2.2 L2.6.8 L4.1,5.7 L0,2.7 L-4.1,5.7 L-2.6.8 L-6.7,-2.2 L-1.6,-2.2 Z"/>
          <path transform="translate(40 38)" d="M0,-7 L1.6,-2.2 L6.7,-2.2 L2.6.8 L4.1,5.7 L0,2.7 L-4.1,5.7 L-2.6.8 L-6.7,-2.2 L-1.6,-2.2 Z"/>
        </g>
      </svg>
      <h1>Bedford County, Tennessee</h1>
      <p>bedfordtn.com</p>
    </div>
  </main>
</body>
</html>
